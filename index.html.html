<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Cheesecake Order</title><style>
:root{--cream:#fffaf4;--ink:#2e2523;--accent:#8d3f54;--soft:#f3e5df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}.hero{padding:34px 20px 22px;text-align:center;background:linear-gradient(135deg,#f9e9e1,#fffaf4)}h1{font-family:Georgia,serif;margin:0;font-size:35px}.hero p{margin:8px 0 0;color:#725f59}.wrap{max-width:900px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:white;border:1px solid #eadbd5;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #5d39220d}.pic{height:145px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#f3d7cf,#f8eee7)}.content{padding:15px}.title{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:18px}.desc{font-size:14px;color:#75625d;min-height:40px;margin:7px 0 13px}.qty{display:flex;align-items:center;justify-content:flex-end;gap:12px}.qty button{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);font-size:22px;color:var(--ink)}.qty span{font-weight:800;min-width:20px;text-align:center}.checkout{margin-top:24px;background:white;padding:18px;border:1px solid #eadbd5;border-radius:18px}label{font-size:13px;font-weight:700;display:block;margin:13px 0 5px}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #d9c9c3;border-radius:10px;background:#fff}textarea{min-height:80px}.bar{position:fixed;left:0;right:0;bottom:0;background:#2e2523;color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:0 -5px 20px #0002}.bar b{font-size:18px}.bar button,.place{border:0;border-radius:12px;background:#f2d6c9;color:#342724;padding:13px 18px;font-weight:800;font-size:15px}.place{width:100%;margin-top:16px;background:var(--accent);color:white}.empty{color:#85736d;font-size:14px}.success{display:none;text-align:center;padding:28px}.success .check{font-size:55px}.admin{font-size:12px;text-align:center;color:#98827a;margin:25px} @media(max-width:500px){h1{font-size:30px}.wrap{padding:12px}.grid{grid-template-columns:1fr}.pic{height:125px}}
</style></head><body><div class='hero'><h1>Cheesecake Order</h1><p>Choose your favorites below • Test ordering page</p></div><main class='wrap'><div id='shop'><div class='grid' id='grid'></div><section class='checkout' id='checkout'><h2 style='margin-top:0'>Your order</h2><div id='summary' class='empty'>Add a cheesecake above to get started.</div><label>Name *</label><input id='name' placeholder='Your name'><label>Phone or email *</label><input id='contact' placeholder='Best way to reach you'><label>Pickup</label><select id='pickup'><option>Work pickup</option><option>Arrange pickup</option></select><label>Notes</label><textarea id='notes' placeholder='Anything we should know?'></textarea><button class='place' onclick='placeOrder()'>Place Test Order</button></section></div><section class='checkout success' id='success'><div class='check'>✓</div><h2>Order received!</h2><p>Your test order number is <b id='orderno'></b>.</p><p id='successSummary'></p><button class='place' onclick='resetOrder()'>Start Another Order</button></section><div class='admin'>TEST VERSION • Orders are saved only on this device for now.</div></main><div class='bar'><div><b id='barTotal'>$0.00</b><div id='barItems' style='font-size:12px;color:#d8c7c1'>0 items</div></div><button onclick="document.getElementById('checkout').scrollIntoView({behavior:'smooth'})">View Order →</button></div><script>
const products=[['Huckleberry',25,'Huckleberry swirl • Graham cracker crust','🫐'],['Biscoff',25,'Cookie butter cheesecake • Biscoff crust','🍪'],["Reese's",28,'Chocolate • Peanut butter • Reese’s','🥜'],['Oreo',25,'Cookies & cream • Oreo crust','🍫'],['Strawberry',25,'Strawberry topping • Classic crust','🍓'],['Classic',22,'Rich classic cheesecake • Graham crust','🍰']];let q=Array(products.length).fill(0);const money=n=>'$'+n.toFixed(2);function render(){document.getElementById('grid').innerHTML=products.map((p,i)=>`<article class='card'><div class='pic'>${p[3]}</div><div class='content'><div class='title'><span>${p[0]}</span><span>${money(p[1])}</span></div><div class='desc'>${p[2]}</div><div class='qty'><button onclick='change(${i},-1)'>−</button><span>${q[i]}</span><button onclick='change(${i},1)'>+</button></div></div></article>`).join('');let count=q.reduce((a,b)=>a+b,0),total=q.reduce((s,n,i)=>s+n*products[i][1],0);barTotal.textContent=money(total);barItems.textContent=count+' item'+(count===1?'':'s');summary.innerHTML=count?q.map((n,i)=>n?`<div style="display:flex;justify-content:space-between;margin:7px 0"><span>${n} × ${products[i][0]}</span><b>${money(n*products[i][1])}</b></div>`:'').join('')+`<hr><div style="display:flex;justify-content:space-between"><b>Total</b><b>${money(total)}</b></div>`:'Add a cheesecake above to get started.';summary.className=count?'':'empty'}function change(i,d){q[i]=Math.max(0,q[i]+d);render()}function placeOrder(){let count=q.reduce((a,b)=>a+b,0);if(!count)return alert('Please add at least one cheesecake.');if(!name.value.trim()||!contact.value.trim())return alert('Please enter your name and contact information.');let total=q.reduce((s,n,i)=>s+n*products[i][1],0),num='CC-'+String(Date.now()).slice(-6);let order={number:num,date:new Date().toISOString(),name:name.value,contact:contact.value,pickup:pickup.value,notes:notes.value,items:q.map((n,i)=>n?{flavor:products[i][0],qty:n,price:products[i][1]}:null).filter(Boolean),total};let saved=JSON.parse(localStorage.getItem('cheesecakeOrders')||'[]');saved.push(order);localStorage.setItem('cheesecakeOrders',JSON.stringify(saved));orderno.textContent=num;successSummary.textContent=count+' cheesecake'+(count===1?'':'s')+' • '+money(total);shop.style.display='none';success.style.display='block';document.querySelector('.bar').style.display='none';scrollTo(0,0)}function resetOrder(){q.fill(0);name.value='';contact.value='';notes.value='';shop.style.display='block';success.style.display='none';document.querySelector('.bar').style.display='flex';render();scrollTo(0,0)}render();
</script></body></html>
